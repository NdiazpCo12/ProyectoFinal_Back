apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-python
  namespace: runners
  labels:
    app: worker-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-python
  template:
    metadata:
      labels:
        app: worker-python
    spec:
      containers:
      - name: worker-python
        image: worker-python:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_NAME
          value: worker-python
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: REDIS_PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: worker-secrets
              key: DATABASE_URL
        - name: TIME_LIMIT_MS
          valueFrom:
            secretKeyRef:
              name: worker-secrets
              key: TIME_LIMIT_MS
        - name: MEMORY_LIMIT_MB
          valueFrom:
            secretKeyRef:
              name: worker-secrets
              key: MEMORY_LIMIT_MB
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: sandbox
          mountPath: /app/.sandbox
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: sandbox
        emptyDir: {}

