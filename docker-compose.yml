version: "3.9"
services:
  api:
    build: ./api
    container_name: api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend
      - REDIS_HOST=redis
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
    depends_on:
      - db
      - redis
    command: npm run start:dev
    volumes:
      - ./api:/app
      - /app/node_modules

  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
